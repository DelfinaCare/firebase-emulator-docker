# Quick try: docker compose up --build, then open http://localhost:4000
services:
  firebase:
    build: .
    environment:
      FIREBASE_PROJECT: demo-project
      PUBSUB_PUSH_BASE_URL: http://host.docker.internal:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 4000:4000 # Emulator UI
      - 4500:4500 # logging (used by the UI)
      - 9099:9099 # auth
      - 8085:8085 # pubsub
    volumes:
      - firebase-data:/data
      - ./examples/devcontainer/.devcontainer/pubsub.yaml:/etc/firebase/pubsub.yaml:ro

volumes:
  firebase-data:
